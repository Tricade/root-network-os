name: Container build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.1
      - name: Record actual tools and validate Compose
        run: |
          docker version
          docker buildx version
          docker compose version
          docker compose config --quiet
      - name: Build and execute the native image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          IMAGE="ghcr.io/tricade/root-network-os:$VERSION-$ARCH"
          docker buildx build --load --platform "linux/$ARCH" --tag "$IMAGE" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          node tools/docker/smoke.cjs "$IMAGE"
      - name: Export the tested release image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          mkdir -p artifacts
          docker save "ghcr.io/tricade/root-network-os:$VERSION-$ARCH" | gzip > "artifacts/docker-$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: docker-${{ matrix.arch }}
          path: artifacts/docker-*.tar.gz
          if-no-files-found: error
          retention-days: 7
